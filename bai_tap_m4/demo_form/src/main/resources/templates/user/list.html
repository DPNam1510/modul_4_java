<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>List User</title>
    <th:block th:insert="layout/layout :: library"/>
</head>
<body>
<h2>USER LIST</h2>

<form action="/blogs" method="get" class="row mb-3">
    <div th:if="${isSuccess}" class="success" th:text="${isSuccess}"></div>
    <div class="col-md-6 text-end">
        <a href = "/users/save" class="btn btn-add">Add New User</a>
    </div>
</form>
<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Gender</th>
        <th>Age</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="u : ${userList}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.firstName}"></td>
        <td th:text="${u.lastName}"></td>
        <td th:text="${u.gender ? 'Male' : 'Female'}"></td>
        <td th:text="${u.age}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.phone}"></td>
        <td>
            <form th:action="@{/users/delete/{id}(id=${u.id})}"
                  method="post"
                  onsubmit="return confirm('Delete this user?')">
                <button type="submit" class="btn btn-delete">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>

</table>
</body>
</html>
