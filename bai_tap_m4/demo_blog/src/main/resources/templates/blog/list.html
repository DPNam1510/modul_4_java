<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog List</title>
    <th:block th:insert="layout/layout :: library"/>
</head>
<body>
<div class="container mt-4">
    <h3 class="mb-3">Blog List</h3>
    <form action="/blogs" method="get" class="row mb-3">
        <div class="col-md-4">
            <input type="text" name="searchTitle" class="form-control"
                   placeholder="Search by title"
                   th:value="${searchTitle}">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary">Search</button>
        </div>
        <div class="col-md-6 text-end">
            <a href="/blogs/save" class="btn btn-success">+ Add Blog</a>
        </div>
    </form>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Category</th>
            <th width="200">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="blog,loop:${blogPage.content}">
            <td th:text="${loop.count}"></td>
            <td th:text="${blog.title}"></td>
            <td th:text="${blog.category.name}"></td>
            <td>
                <a th:href="@{/blogs/detail/{id}(id=${blog.id})}"
                   class="btn btn-info btn-sm">Detail</a>
                <form th:action="@{/blogs/delete/{id}(id=${blog.id})}"
                      method="post" style="display:inline">
                    <button class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this blog?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<a class="btn btn-primary" th:if="${blogPage.hasPrevious()}"
   th:href="@{/blogs(page = ${blogPage.number -1},searchTitle = ${searchTitle})}">Previous</a>
<span th:text="${blogPage.number +1}"></span>/<span th:text="${blogPage.totalPages}"></span>
<a class="btn btn-primary" th:if="${blogPage.hasNext()}"
   th:href="@{/blogs(page = ${blogPage.number +1},searchTitle = ${searchTitle})}">Next</a>
</body>
</html>
